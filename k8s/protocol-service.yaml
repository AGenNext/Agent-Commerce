apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-commerce-protocol
  labels:
    app.kubernetes.io/name: agent-commerce-protocol
    app.kubernetes.io/part-of: agent-commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-commerce-protocol
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-commerce-protocol
        app.kubernetes.io/part-of: agent-commerce
    spec:
      containers:
        - name: protocol-service
          image: ghcr.io/agennext/agent-commerce-protocol:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-commerce-protocol
  labels:
    app.kubernetes.io/name: agent-commerce-protocol
    app.kubernetes.io/part-of: agent-commerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-commerce-protocol
  ports:
    - name: http
      port: 8080
      targetPort: http
