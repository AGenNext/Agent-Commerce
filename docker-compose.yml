# Docker Compose - Agent-Commerce
# One-command deployable stack: SurrealDB + schema migration + API.
#
#   docker compose up -d
#
# Add OpenFGA authorization (optional):
#   docker compose -f docker-compose.yml -f docker-compose.openfga.yml up -d
#
# API:      http://localhost:8080   (health: /health, ready: /ready)
# SurrealDB: ws://localhost:8000/rpc
# Tests:    docker compose --profile test run --rm agent-test

services:
  surrealdb:
    image: surrealdb/surrealdb:v2.3.7
    container_name: agent-commerce-db
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/data
    networks:
      - agent-network
    command: start --user root --pass root --bind 0.0.0.0:8000 rocksdb:/data/surreal.db
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies SurrealQL migrations in dependency order, then exits.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-commerce-migrate
    environment:
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - SURREALDB_USER=root
      - SURREALDB_PASSWORD=root
      - SURREALDB_NAMESPACE=ucp
      - SURREALDB_DATABASE=ecommerce
    depends_on:
      surrealdb:
        condition: service_healthy
    networks:
      - agent-network
    restart: "no"
    entrypoint: python3
    command: scripts/apply_surreal_migrations.py

  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-commerce-api
    ports:
      - "8080:8000"
    environment:
      - ENVIRONMENT=development
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - SURREALDB_USER=root
      - SURREALDB_PASSWORD=root
      - SURREALDB_NAMESPACE=ucp
      - SURREALDB_DATABASE=ecommerce
      - API_KEY=local-dev-api-key
      - ADMIN_API_KEY=local-dev-admin-key
      - JWT_SECRET=local-dev-jwt-secret
      # OpenFGA is optional and fail-open by default (see docker-compose.openfga.yml)
      - OPENFGA_ENABLED=false
    depends_on:
      surrealdb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - agent-network

  agent-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-commerce-test
    environment:
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - SURREALDB_USER=root
      - SURREALDB_PASSWORD=root
      - ENVIRONMENT=test
    depends_on:
      - agent-api
    networks:
      - agent-network
    entrypoint: python3
    command: test_e2e.py
    profiles:
      - test

volumes:
  surrealdb_data:

networks:
  agent-network:
    driver: bridge
