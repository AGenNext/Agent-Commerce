# Docker Compose - Agent-Commerce
# Development and integration testing stack

version: '3.8'

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: agent-commerce-db
    ports:
      - "8000:8000"
    environment:
      - SURREALDB_USER=agent
      - SURREALDB_PASSWORD=commerce
      - SURREALDB_DATABASE=commerce
    volumes:
      - surrealdb_data:/var/lib/surrealdb
    networks:
      - agent-network
    command: start --bind 0.0.0.0:8000 memory --auth

  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-commerce-api
    ports:
      - "8080:8000"
    environment:
      - ENVIRONMENT=development
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - SURREALDB_USER=agent
      - SURREALDB_PASSWORD=commerce
      - SURREALDB_NAMESPACE=ucp
      - SURREALDB_DATABASE=ecommerce
      - API_KEY=local-dev-api-key
      - ADMIN_API_KEY=local-dev-admin-key
      - JWT_SECRET=local-dev-jwt-secret
    depends_on:
      - surrealdb
    networks:
      - agent-network
    volumes:
      - ./:/workspace/agent

  agent-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-commerce-test
    environment:
      - SURREALDB_URL=mem://
      - ENVIRONMENT=test
    depends_on:
      - agent-api
    networks:
      - agent-network
    entrypoint: python3
    command: test_e2e.py
    profiles:
      - test

volumes:
  surrealdb_data:

networks:
  agent-network:
    driver: bridge

# Usage:
# docker compose up -d
# API: http://localhost:8080
# Health: http://localhost:8080/health
# Readiness: http://localhost:8080/ready
# Tests: docker compose --profile test run --rm agent-test
