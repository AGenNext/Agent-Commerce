name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .

      - name: Type check
        run: |
          mypy .

      - name: Run unit/integration tests
        env:
          ENVIRONMENT: test
          SURREALDB_URL: mem://
          API_KEY: ci-api-key
          ADMIN_API_KEY: ci-admin-key
          JWT_SECRET: ci-jwt-secret
        run: |
          pytest -q || python test_e2e.py

      - name: Health endpoint smoke test
        env:
          ENVIRONMENT: test
          API_KEY: ci-api-key
          ADMIN_API_KEY: ci-admin-key
          JWT_SECRET: ci-jwt-secret
          SURREALDB_URL: mem://
        run: |
          python server.py &
          SERVER_PID=$!
          sleep 5
          curl -fsS http://127.0.0.1:8000/health
          kill $SERVER_PID

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
