name: Protocol Service

on:
  pull_request:
    paths:
      - 'protocol_service/**'
      - 'schemas/foundation-agent-commerce-protocol-profile.schema.json'
      - 'docs/foundation-agent-commerce-protocol-profile.md'
      - 'docs/deploy-foundation-agent-commerce-protocol.md'
      - 'Dockerfile.protocol'
      - 'docker-compose.protocol.yml'
      - 'requirements-protocol.txt'
      - 'k8s/protocol-service.yaml'
      - 'tests/test_protocol_service.py'
      - '.github/workflows/protocol-service.yml'
  push:
    branches: [main]
    paths:
      - 'protocol_service/**'
      - 'schemas/foundation-agent-commerce-protocol-profile.schema.json'
      - 'docs/foundation-agent-commerce-protocol-profile.md'
      - 'docs/deploy-foundation-agent-commerce-protocol.md'
      - 'Dockerfile.protocol'
      - 'docker-compose.protocol.yml'
      - 'requirements-protocol.txt'
      - 'k8s/protocol-service.yaml'
      - 'tests/test_protocol_service.py'
      - '.github/workflows/protocol-service.yml'

permissions:
  contents: read
  packages: write

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-protocol.txt

      - name: Import service
        run: python -c "from protocol_service.main import app; print(app.title)"

      - name: Validate JSON schema
        run: python -m json.tool schemas/foundation-agent-commerce-protocol-profile.schema.json >/tmp/protocol-schema.json

      - name: Run protocol tests
        run: pytest tests/test_protocol_service.py -q

      - name: Build Docker image
        run: docker build -f Dockerfile.protocol -t ghcr.io/agennext/agent-commerce-protocol:${{ github.sha }} .

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GHCR image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/agennext/agent-commerce-protocol:${{ github.sha }} ghcr.io/agennext/agent-commerce-protocol:latest
          docker push ghcr.io/agennext/agent-commerce-protocol:${{ github.sha }}
          docker push ghcr.io/agennext/agent-commerce-protocol:latest
